# fly.toml app configuration file generated for REVIEWsite
app = 'reviewsite-app'
primary_region = 'sin' # Singapore (fastest latency for Philippines: ~30ms)

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3001'
  DB_PATH = '/data/reviewsite.db'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[mounts]]
  source = 'reviewsite_data'
  destination = '/data'
  initial_size = '1gb'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[[http_service.checks]]
  grace_period = '15s'
  interval = '30s'
  method = 'GET'
  path = '/api/health'
  timeout = '5s'
